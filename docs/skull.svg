<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420" role="img" aria-label="Pirate skull boot logo">
  <rect width="420" height="420" fill="#0b0f13"/>
  <g stroke="none">
    <!-- Crossbones -->
    <g fill="#e9eef2">
      <g transform="rotate(45 210 210)">
        <rect x="70" y="196" width="280" height="28" rx="14"/>
        <circle cx="70" cy="196" r="20"/><circle cx="70" cy="224" r="20"/>
        <circle cx="350" cy="196" r="20"/><circle cx="350" cy="224" r="20"/>
      </g>
      <g transform="rotate(-45 210 210)">
        <rect x="70" y="196" width="280" height="28" rx="14"/>
        <circle cx="70" cy="196" r="20"/><circle cx="70" cy="224" r="20"/>
        <circle cx="350" cy="196" r="20"/><circle cx="350" cy="224" r="20"/>
      </g>
    </g>
    <!-- Skull -->
    <g fill="#f4f7f9">
      <rect x="150" y="205" width="120" height="120" rx="34"/>
      <circle cx="210" cy="185" r="92"/>
      <circle cx="152" cy="230" r="34"/>
      <circle cx="268" cy="230" r="34"/>
    </g>
    <!-- Eyes -->
    <circle cx="178" cy="178" r="30" fill="#0b0f13"/>
    <circle cx="242" cy="178" r="30" fill="#0b0f13"/>
    <circle cx="188" cy="168" r="6" fill="#ff4d4d"/>
    <!-- Eyepatch on right eye -->
    <circle cx="242" cy="178" r="36" fill="#0b0f13"/>
    <path d="M276 150 L150 120 M276 150 L298 206" stroke="#0b0f13" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- Nose -->
    <path d="M210 214 l-16 26 h32 z" fill="#0b0f13"/>
    <!-- Laughing mouth: teeth with gaps -->
    <g>
      <rect x="170" y="258" width="80" height="44" rx="8" fill="#0b0f13"/>
      <g fill="#f4f7f9">
        <rect x="176" y="258" width="9" height="15"/><rect x="190" y="258" width="9" height="15"/>
        <rect x="204" y="258" width="9" height="15"/><rect x="218" y="258" width="9" height="15"/>
        <rect x="232" y="258" width="9" height="15"/>
        <rect x="176" y="287" width="9" height="15"/><rect x="190" y="287" width="9" height="15"/>
        <rect x="204" y="287" width="9" height="15"/><rect x="218" y="287" width="9" height="15"/>
        <rect x="232" y="287" width="9" height="15"/>
      </g>
    </g>
  </g>
  <text x="210" y="372" text-anchor="middle" font-family="Consolas,monospace" font-size="26" fill="#39d353" font-weight="bold">ESP32 MARAUDER</text>
  <text x="210" y="398" text-anchor="middle" font-family="Consolas,monospace" font-size="16" fill="#ff4d4d">HA! HA! HA!</text>
</svg>
